<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>手机蓝牙控制</title>
  <style>
    *{box-sizing:border-box}body{font-family:system-ui,-apple-system,"Noto Sans SC",sans-serif;background:#f3f6fb;color:#172033;margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}
    main{width:min(100%,420px);background:white;border-radius:24px;padding:28px;box-shadow:0 12px 40px #15233b18;text-align:center}
    h1{font-size:25px;margin:0 0 8px}p{color:#637087;line-height:1.6}
    button{width:100%;border:0;border-radius:14px;padding:16px;font-size:17px;font-weight:650;margin-top:12px;cursor:pointer}
    .on{background:#1769e0;color:white}.off{background:#e9eef5;color:#172033}
    .note{font-size:13px;margin-top:18px}
  </style>
</head>
<body>
<main>
  <h1>手机蓝牙控制</h1>
  <p>选择要执行的操作。按钮会打开手机上的蓝牙控制 App。</p>
  <button class="on" onclick="launch('on')">开启蓝牙</button>
  <button class="off" onclick="launch('off')">关闭蓝牙</button>
  <p class="note">Android 系统可能要求确认。关闭操作会打开系统蓝牙设置，请手动关闭。</p>
</main>
<script>
function launch(action){
  const target = action === 'on' ? 'btcontrol://on' : 'btcontrol://off';
  window.location.href = target;
}
</script>
</body>
</html>
